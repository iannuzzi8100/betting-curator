name: Daily Betting Pipeline

on:
  schedule:
    # 08:12 UTC = 3:12 AM EST (shifted off :00 to avoid GitHub cron queue drops)
    - cron: '12 8 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Which script to run manually'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - settle_only
          - curate_only

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y google-generativeai || true
          pip install --upgrade gspread google-auth requests google-genai

      - name: Run Nightly Settler (Grades Pending Bets First)
        if: ${{ github.event_name == 'schedule' || inputs.task == 'both' || inputs.task == 'settle_only' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python settler.py

      - name: Run Daily Curator (Scrapes Hard Rock / Multi-Site Data & Curates Slate Second)
        if: ${{ github.event_name == 'schedule' || inputs.task == 'both' || inputs.task == 'curate_only' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python curator.py
