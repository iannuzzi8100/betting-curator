name: Daily Betting Intel Scrape & 9:12 AM Telegram Curator

on:
  schedule:
    # Overnight / Morning Runs (3:12 AM, 8:30 AM, and 9:12 AM EST)
    - cron: '12 8 * * *'
    - cron: '30 13 * * *'
    - cron: '12 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode (all, settle, scrape, curate)'
        required: false
        default: 'all'

jobs:
  run-betting-pipeline:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INTEL_DOC_ID: ${{ secrets.INTEL_DOC_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
