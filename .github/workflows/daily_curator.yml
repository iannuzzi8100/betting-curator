name: Daily Betting Intel Scrape & 9:12 AM Telegram Curator

on:
  schedule:
    - cron: '12 8 * * *'
    - cron: '30 13 * * *'
    - cron: '12 14 * * *'
  workflow_dispatch:

jobs:
  run-betting-pipeline:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INTEL_DOC_ID: ${{ secrets.INTEL_DOC_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python settler.py
      - run: python scraper.py
      - run: python curator.py
      - if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Daily Betting Pipeline failed. Check GitHub Actions logs."
