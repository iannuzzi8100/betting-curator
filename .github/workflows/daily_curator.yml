name: Daily Betting Intel Scrape & 9:12 AM Telegram Curator

on:
  schedule:
    - cron: '12 8 * * *'
    - cron: '30 13 * * *'
    - cron: '12 14 * * *'
  workflow_dispatch:

jobs:
  run-betting-pipeline:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INTEL_DOC_ID: ${{ secrets.INTEL_DOC_ID }}
      SHEET_ID: ${{ secrets.SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.SHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write Google Service Account credentials.json
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Settler
        continue-on-error: true
        run: python settler.py

      - name: Run Scraper
        run: python scraper.py

      - name: Run Curator
        run: python curator.py

      - name: Send Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Daily Betting Pipeline failed. Check GitHub Actions logs."
