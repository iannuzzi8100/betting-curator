name: Daily Betting Intel Scrape & 9:12 AM Telegram Curator

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 min — Stage 0: Sync any new Telegram bet screenshots/messages to Google Sheet
    - cron: '12 8 * * *'   # 03:12 AM EST — Stage 1: Settle yesterday's pending bets
    - cron: '30 13 * * *'  # 08:30 AM EST — Stage 2: Morning scrape (odds, props, news & YouTube intel)
    - cron: '12 14 * * *'  # 09:12 AM EST — Stage 3: Morning curate & deliver Telegram slip
    - cron: '0 22 * * *'   # 05:00 PM EST — Stage 4a: Primetime pre-tipoff scrape (late injuries & sharp moves)
    - cron: '30 22 * * *'  # 05:30 PM EST — Stage 4b: Primetime curator refresh & Telegram slip
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - logger
          - settler
          - scraper
          - curator

jobs:
  run-betting-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INTEL_DOC_ID: ${{ secrets.INTEL_DOC_ID || '1vTMvUyr_DABrrzVBU7ah1A8RYn9-sfO1Uu-0Syk2jnU' }}
      MASTER_SHEET_ID: ${{ secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SHEET_ID: ${{ secrets.SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Write Google Service Account credentials.json
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 0 - Sync Placed Bets from Telegram Bot (Screenshots & Text)
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'logger' || inputs.stage == ''))
        run: python bet_logger.py

      - name: Step 1 - Run Settler (03:12 AM EST + Pre-Scrape Safety Check)
        if: github.event.schedule == '12 8 * * *' || github.event.schedule == '30 13 * * *' || github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'settler' || inputs.stage == ''))
        run: python settler.py

      - name: Step 2 - Run Scraper (08:30 AM EST & 05:00 PM EST Primetime Refresh)
        if: github.event.schedule == '30 13 * * *' || github.event.schedule == '0 22 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'scraper' || inputs.stage == ''))
        run: python scraper.py

      - name: Step 3 - Run Curator (09:12 AM EST & 05:30 PM EST Primetime Refresh)
        if: github.event.schedule == '12 14 * * *' || github.event.schedule == '30 22 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'curator' || inputs.stage == ''))
        run: python curator.py

      - name: Step 4 - Rebuild & Publish Mobile Web App (docs/index.html)
        continue-on-error: true
        run: |
          python dashboard_app.py --build-static
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || (git commit -m "Auto-update live betting dashboard" && git push)

      - name: Send Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Daily Betting Pipeline failed (trigger: ${{ github.event.schedule || inputs.stage || github.event_name }}). Check GitHub Actions logs."
