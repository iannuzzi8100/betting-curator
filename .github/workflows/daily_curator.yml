name: Daily Betting Intel Scrape & 9:12 AM Telegram Curator

on:
  schedule:
    - cron: '7,37 12-23,0-4 * * *' # Every 30 min off-peak (:07/:37, 07:07 AM–11:37 PM EST) — Fallback Telegram sync & live settlement
    - cron: '12 8 * * *'           # 03:12 AM EST — Stage 1: Settle yesterday's pending bets
    - cron: '45 11 * * 6,0'        # 06:45 AM EST (Sat & Sun) — Early Weekend EPL + CFB/NFL Time-Slot Scrape & Curate
    - cron: '15 15 * * 1-5'        # 10:15 AM EST (Mon–Fri) — Weekday Morning Scrape & Pre-Scrape Settler
    - cron: '30 15 * * 1-5'        # 10:30 AM EST (Mon–Fri) — Weekday Morning Curate & Telegram Slip
    - cron: '15 16 * * 6'          # 11:15 AM EST (Sat) — Settle Morning EPL + CFB Noon/Afternoon/Primetime Refresh
    - cron: '45 19 * * 6'          # 02:45 PM EST (Sat) — Settle Noon CFB + CFB 3:30 PM/Primetime Refresh
    - cron: '35 16 * * 0'          # 11:35 AM EST (Sun) — Settle Morning EPL + NFL 1PM Inactives Refresh
    - cron: '35 20 * * 0'          # 03:35 PM EST (Sun) — Settle 1PM NFL + NFL 4PM/SNF Refresh
    - cron: '30 22 * * *'          # 05:30 PM EST (Daily) — Settle Afternoon + Primetime Scrape
    - cron: '45 22 * * *'          # 05:45 PM EST (Daily) — Primetime Curate / Pre-Tipoff Audit & Telegram Alert
    - cron: '30 3 * * 1'           # 10:30 PM EST (Sunday) — Weekly Performance Recap Digest to Telegram
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - logger
          - settler
          - scraper
          - curator
          - watchdog
          - weekly_digest
      regrade_bet_id:
        description: 'Optional comma-separated Bet ID(s) to re-evaluate against ESPN (e.g. BET-063)'
        required: false
        default: ''
        type: string
      ignore_cap:
        description: 'Ignore active pending exposure cap to preview full Tier 1/2 + Marquee slate'
        required: false
        default: false
        type: boolean

jobs:
  run-betting-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REGRADE_BET_ID: ${{ inputs.regrade_bet_id || '' }}
      IGNORE_EXPOSURE_CAP: ${{ inputs.ignore_cap || false }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INTEL_DOC_ID: ${{ secrets.INTEL_DOC_ID || '1vTMvUyr_DABrrzVBU7ah1A8RYn9-sfO1Uu-0Syk2jnU' }}
      MASTER_SHEET_ID: ${{ secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SHEET_ID: ${{ secrets.SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Write Google Service Account credentials.json
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Step 0 - Sync Placed Bets from Telegram Bot (Screenshots & Text)
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'logger' || inputs.stage == ''))
        run: python bet_logger.py

      - name: Step 1 - Run Settler (Every 30 Min When Bets Are Pending + Scheduled Checks)
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'settler' || inputs.stage == ''))
        run: python settler.py

      - name: Step 1.5 - Pre-Tipoff Injury, Goalie & Reverse-Steam Watchdog (Free ESPN)
        continue-on-error: true
        if: github.event.schedule == '7,37 12-23,0-4 * * *' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'watchdog')
        run: python watchdog.py

      - name: Step 2 - Run Scraper (On Time-Slot Schedules OR Immediately After a Bet Settles)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'scraper' || inputs.stage == ''))
        run: |
          if [ -f ".settled_changed" ] || [ "${{ github.event.schedule }}" = "45 11 * * 6,0" ] || [ "${{ github.event.schedule }}" = "15 15 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 16 * * 6" ] || [ "${{ github.event.schedule }}" = "45 19 * * 6" ] || [ "${{ github.event.schedule }}" = "35 16 * * 0" ] || [ "${{ github.event.schedule }}" = "35 20 * * 0" ] || [ "${{ github.event.schedule }}" = "30 22 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scraper.py
          fi

      - name: Step 3 - Run Curator (On Time-Slot Schedules OR Immediately After a Bet Settles)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.stage == 'all' || inputs.stage == 'curator' || inputs.stage == ''))
        run: |
          if [ -f ".settled_changed" ] || [ "${{ github.event.schedule }}" = "45 11 * * 6,0" ] || [ "${{ github.event.schedule }}" = "30 15 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 16 * * 6" ] || [ "${{ github.event.schedule }}" = "45 19 * * 6" ] || [ "${{ github.event.schedule }}" = "35 16 * * 0" ] || [ "${{ github.event.schedule }}" = "35 20 * * 0" ] || [ "${{ github.event.schedule }}" = "45 22 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python curator.py
          fi

      - name: Step 4 - Rebuild & Publish Mobile Web App (Whenever Bet Logged, Settled, or Slate Updated)
        continue-on-error: true
        run: |
          if [ -f ".tg_changed" ] || [ -f ".settled_changed" ] || [ "${{ github.event.schedule }}" = "12 8 * * *" ] || [ "${{ github.event.schedule }}" = "30 3 * * 1" ] || [ "${{ github.event.schedule }}" = "45 11 * * 6,0" ] || [ "${{ github.event.schedule }}" = "30 15 * * 1-5" ] || [ "${{ github.event.schedule }}" = "15 16 * * 6" ] || [ "${{ github.event.schedule }}" = "45 19 * * 6" ] || [ "${{ github.event.schedule }}" = "35 16 * * 0" ] || [ "${{ github.event.schedule }}" = "35 20 * * 0" ] || [ "${{ github.event.schedule }}" = "45 22 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python dashboard_app.py --build-static
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/index.html docs/data.json
            git diff --staged --quiet || (git commit -m "Auto-update live betting dashboard" && (git pull --rebase origin main || true) && git push)
          else
            echo "No Telegram or settlement changes detected; skipping dashboard rebuild."
          fi

      - name: Step 5 - Sunday-Night Weekly Performance Recap Digest
        continue-on-error: true
        if: github.event.schedule == '30 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'weekly_digest')
        run: python weekly_digest.py

      - name: Send Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ Daily Betting Pipeline failed (trigger: ${{ github.event.schedule || inputs.stage || github.event_name }}). Check GitHub Actions logs."
