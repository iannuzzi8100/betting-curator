name: One-Shot Ledger Reconciliation & Sunday Refresh

on:
  workflow_dispatch:

jobs:
  reconcile-and-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INTEL_DOC_ID: ${{ secrets.INTEL_DOC_ID || '1vTMvUyr_DABrrzVBU7ah1A8RYn9-sfO1Uu-0Syk2jnU' }}
      MASTER_SHEET_ID: ${{ secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SHEET_ID: ${{ secrets.SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SPREADSHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.TRACKER_SHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || secrets.MASTER_SHEET_ID || secrets.SHEET_ID || secrets.SPREADSHEET_ID || '1TClaBQb82kDz1ddgileMesO3IZ3ePrAp-8G-ScxYkP8' }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY || secrets.GCP_SERVICE_ACCOUNT_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Write credentials.json
        run: echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reconcile missed Stanford bet and restore ledger to $43.78
        run: python reconcile_ledger.py
      - name: Run Sunday Scraper (NFL + EPL)
        run: python scraper.py
      - name: Run Sunday Curator (Confidence Meter Slate for $43.78 BR)
        run: python curator.py
      - name: Rebuild & Publish Dashboard
        run: |
          python dashboard_app.py --build-static
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/data.json
          git diff --staged --quiet || (git commit -m "Auto-update live betting dashboard (reconciled $43.78 + Sunday slate)" && (git pull --rebase origin main || true) && git push)
